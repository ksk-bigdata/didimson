<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디딤손 키오스크</title>
<style>
:root{color-scheme:light;--bg:#f2f4f8;--card:#fff;--ink:#0f172a;--sub:#475569;--line:#e5e9f0;--pri:#3b5bff;--soft:#eaeefe;--ok:#0e9f6e;--warn:#b45309;--chip:#f1f4f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1020;--card:#161d33;--ink:#f1f5f9;--sub:#b6c0d4;--line:#27314d;--pri:#7b93ff;--soft:#222c52;--ok:#34d399;--warn:#fbbf24;--chip:#1f2842}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Microsoft YaHei',sans-serif;word-break:keep-all}
body{background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:4px solid var(--pri);outline-offset:2px}
.app{width:100%;max-width:480px;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.app.xl{zoom:1.15}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px;gap:8px}
.top h1{font-size:23px;font-weight:800;letter-spacing:-.5px}
.tr{display:flex;gap:8px}
.zoom,.lang{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;font-size:16px;font-weight:700}
.steps{display:flex;gap:6px;padding:0 20px 8px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--pri)}
.screen{display:none;flex:1;flex-direction:column;padding:12px 20px 20px}
.screen.active{display:flex}
h2.t{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 14px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.mode{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border-radius:28px;padding:24px;min-height:136px;margin-bottom:16px;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.mode .mi{font-size:50px}.mode b{display:block;font-size:26px;margin-bottom:4px}.mode small{font-size:17px;font-weight:600;color:var(--sub)}
.mode.hi{background:linear-gradient(135deg,#3b5bff,#6a7dff);color:#fff;box-shadow:0 10px 24px rgba(59,91,255,.35)}.mode.hi small{color:rgba(255,255,255,.88)}
.mega{background:#ffd400;color:#1a1a1a;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:20px;box-shadow:0 10px 24px rgba(255,212,0,.35)}
.mlogo b{display:block;font-size:46px;font-weight:900;letter-spacing:3px;line-height:1}
.mlogo span{display:block;font-size:17px;font-weight:800;letter-spacing:7px;margin-top:6px}
.mtag{display:inline-block;margin-top:14px;background:#1a1a1a;color:#ffd400;border-radius:999px;padding:8px 18px;font-size:17px;font-weight:800}
.step{display:flex;align-items:center;gap:14px;font-size:19px;font-weight:600;line-height:1.4;padding:10px 0}
.step i{background:var(--soft);color:var(--pri);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-weight:800;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid transparent;border-radius:20px;padding:18px 10px;font-size:20px;font-weight:800;min-height:68px;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.opt.sm{min-height:54px;padding:10px;font-size:18px}
.opt.sel{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.cta{width:100%;min-height:64px;background:var(--pri);color:#fff;font-size:22px;font-weight:800;border-radius:20px;box-shadow:0 8px 20px rgba(59,91,255,.3)}
.cta:disabled{background:var(--line);color:var(--sub);box-shadow:none;cursor:not-allowed}
.cta.ok{background:var(--ok);box-shadow:none}
.back{align-self:flex-start;background:var(--card);border-radius:999px;padding:0 18px;min-height:44px;font-size:17px;font-weight:700;margin-bottom:8px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.wood{background:linear-gradient(145deg,#d9b48a,#b98557);padding:12px;border-radius:30px;box-shadow:0 14px 28px rgba(120,76,36,.3),inset 0 2px 4px rgba(255,255,255,.4);margin-bottom:18px;--card:#fff;--ink:#0f172a;--sub:#475569;--chip:#f1f4f9;--pri:#3b5bff;--soft:#eaeefe;--line:#e5e9f0}
.surface{background:linear-gradient(#f7ecd9,#efe0c8);border-radius:22px;padding:12px;min-height:290px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;box-shadow:inset 0 4px 12px rgba(120,76,36,.2)}
.tcard{background:var(--card);color:var(--ink);border-radius:20px;padding:10px 8px 12px;text-align:center;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.tcard .em{font-size:40px;margin:6px 0 2px}
.x{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:800;color:var(--sub)}
.nm{font-size:17px;font-weight:800;line-height:1.25}.un{font-size:15px;color:var(--sub);font-weight:600;line-height:1.3}
.pr{font-size:18px;font-weight:800;color:var(--pri)}
.qty{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:4px;margin-top:4px}
.qty button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:24px;font-weight:800;color:var(--pri);box-shadow:0 1px 4px rgba(15,23,42,.15)}
.qty b{min-width:30px;text-align:center;font-size:20px}
.slot{border:3px dashed #a98467;border-radius:20px;min-height:170px;background:rgba(255,255,255,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1e293b;padding:8px}
.slot .plus{width:52px;height:52px;border-radius:50%;background:#3b5bff;color:#fff;font-size:30px;display:grid;place-items:center}
.slot b{font-size:18px}.slot small{font-size:15px;font-weight:600;color:#475569}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px}
.tab{flex-shrink:0;background:var(--card);border-radius:999px;padding:0 18px;min-height:50px;font-size:18px;font-weight:800;border:2px solid transparent;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.tab.sel{background:var(--pri);color:#fff}
.nrow{background:var(--card);border-radius:22px;padding:12px;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;margin-bottom:10px;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.nrow .em{font-size:36px;background:var(--chip);border-radius:16px;height:56px;display:grid;place-items:center}
.addb{min-height:50px;padding:0 20px;background:var(--pri);color:#fff;border-radius:16px;font-size:18px;font-weight:800}
.bar{position:sticky;bottom:0;margin:auto -20px -20px;background:var(--card);padding:16px 20px 20px;border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.1)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sum span:first-child{font-size:18px;font-weight:700;color:var(--sub)}.sum b{font-size:28px;font-weight:800}
.tile{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid transparent;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 2px 14px rgba(15,23,42,.06);min-height:76px}
.tile .ic{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--chip);display:grid;place-items:center;flex-shrink:0}
.tile .tx{flex:1}.tile b{display:block;font-size:19px}.tile small{font-size:15px;color:var(--sub);font-weight:600}
.tile .st{font-size:16px;font-weight:800;color:var(--pri)}
.tile.on{border-color:var(--ok);background:var(--soft)}.tile.on .st{color:var(--ok)}
.sec{font-size:18px;font-weight:800;color:var(--sub);margin:10px 4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-2px 0 14px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:16px;min-height:56px;font-size:18px;font-weight:800}
.chip.sel{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.rows .r{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:600;padding:5px 0;color:var(--sub)}
.rows .r.big{font-size:21px;font-weight:800;color:var(--ink);border-top:2px dashed var(--line);margin-top:6px;padding-top:12px}
.ov{display:none;position:fixed;inset:0;background:rgba(8,12,28,.6);z-index:100;justify-content:center;align-items:flex-end}
.ov.active{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);color:var(--ink);border-radius:30px 30px 0 0;padding:22px 20px 28px;max-height:90vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.mh h3{font-size:23px;font-weight:800}
.close{background:var(--chip);border-radius:999px;padding:0 16px;min-height:44px;font-size:17px;font-weight:700;flex-shrink:0}
.cat{background:var(--chip);border-radius:22px;padding:18px 8px;text-align:center}
.cat .e{font-size:40px}.cat b{display:block;font-size:19px;margin-top:6px}
.temp{border-radius:24px;padding:30px 8px;font-size:23px;font-weight:800}
.temp span{display:block;font-size:46px;margin-bottom:8px}
.cold{background:#e3eeff;color:#1d4ed8}.hot{background:#ffe9e6;color:#c2410c}
.menu{background:var(--chip);border-radius:22px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.menu .e{font-size:40px}.menu b.nm{font-size:18px}.menu em{font-style:normal;font-weight:800;font-size:18px;color:var(--pri)}
.menu .add{width:100%;min-height:48px;background:var(--pri);color:#fff;border-radius:14px;font-size:17px;font-weight:800}
.phone{background:var(--chip);border-radius:18px;padding:16px;font-size:28px;font-weight:800;text-align:center;letter-spacing:2px;margin-bottom:6px}
.hint{min-height:24px;text-align:center;font-size:16px;font-weight:700;color:var(--warn);margin-bottom:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keys button{min-height:60px;background:var(--chip);border-radius:16px;font-size:24px;font-weight:800}
.keys button:active{background:var(--soft)}
.spin{width:64px;height:64px;border:7px solid var(--line);border-top-color:var(--pri);border-radius:50%;margin:10px auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;margin:auto 0}
.ticket{background:var(--card);border-radius:24px;padding:18px;margin:16px 0;text-align:left;box-shadow:0 2px 14px rgba(15,23,42,.06)}
.rh{text-align:center;padding-bottom:10px;margin-bottom:8px;border-bottom:2px dashed var(--line)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><h1>🤝 <span data-i="brand"></span></h1>
    <div class="tr"><button class="zoom" id="zoom" onclick="toggleZoom()">🔍</button><button class="lang" onclick="openLang()">🌐 <span id="lang-name">한국어</span></button></div></div>
  <div class="steps" id="steps"><i></i><i></i><i></i></div>

  <div id="s-mode" class="screen active">
    <div class="mega"><div class="mlogo" role="img" aria-label="MEGA MGC COFFEE"><b>MEGA</b><span>MGC COFFEE</span></div><div class="mtag" data-i="megaTag"></div></div>
    <h2 class="t" data-i="modeT"></h2>
    <button class="mode" onclick="setMode('normal')"><span class="mi">🧾</span><span><b data-i="normal"></b><small data-i="normalS"></small></span></button>
    <button class="mode hi" onclick="setMode('easy')"><span class="mi">🤝</span><span><b data-i="easy"></b><small data-i="easyS"></small></span></button>
  </div>

  <div id="s-guide" class="screen">
    <button class="back" data-i="back" onclick="show('s-mode')"></button>
    <h2 class="t" data-i="gT"></h2>
    <div class="card">
      <div class="step"><i>1</i><span data-i="g1"></span></div>
      <div class="step"><i>2</i><span data-i="g2"></span></div>
      <div class="step"><i>3</i><span data-i="g3"></span></div>
    </div>
    <div class="sec" data-i="where"></div>
    <div class="two" style="margin-bottom:20px">
      <button class="opt sel" data-pl="here" data-i="here" onclick="selectPlace('here')"></button>
      <button class="opt" data-pl="togo" data-i="togo" onclick="selectPlace('togo')"></button>
    </div>
    <button class="cta" style="margin-top:auto" data-i="start" onclick="show('s-tray')"></button>
  </div>

  <div id="s-tray" class="screen">
    <button class="back" data-i="back" onclick="show('s-guide')"></button>
    <h2 class="t" data-i="myOrder"></h2>
    <div class="wood"><div class="surface" id="tray-items"></div></div>
    <div class="bar" style="margin-top:auto">
      <div class="sum"><span id="cnt"></span><b id="sub"></b></div>
      <button class="cta" id="next" onclick="show('s-benefit')"></button>
    </div>
  </div>

  <div id="s-normal" class="screen">
    <button class="back" data-i="back" onclick="show('s-mode')"></button>
    <div class="two" style="margin-bottom:12px">
      <button class="opt sm sel" data-pl="here" data-i="here" onclick="selectPlace('here')"></button>
      <button class="opt sm" data-pl="togo" data-i="togo" onclick="selectPlace('togo')"></button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="nlist"></div>
    <div class="bar" style="margin-top:auto">
      <div class="sum"><span id="ncnt"></span><b id="nsub"></b></div>
      <button class="cta" id="nnext" onclick="show('s-benefit')"></button>
    </div>
  </div>

  <div id="s-benefit" class="screen">
    <button class="back" data-i="back" onclick="show(mode==='easy'?'s-tray':'s-normal')"></button>
    <h2 class="t" data-i="benT"></h2>
    <button class="tile" id="t-coupon" onclick="toggleCoupon()"><span class="ic">🎟️</span><span class="tx"><b data-i="coupon"></b><small data-i="couponS"></small></span><span class="st" id="st-coupon"></span></button>
    <button class="tile" id="t-member" onclick="openKeypad('member')"><span class="ic">🎫</span><span class="tx"><b data-i="member"></b><small id="sm-member"></small></span><span class="st" id="st-member"></span></button>
    <button class="tile" id="t-point" onclick="openKeypad('point')"><span class="ic">⭐</span><span class="tx"><b data-i="point"></b><small id="sm-point"></small></span><span class="st" id="st-point"></span></button>
    <div class="sec" data-i="rQ"></div>
    <div class="two">
      <button class="opt sel" id="r-yes" data-i="print" onclick="setReceipt(true)"></button>
      <button class="opt" id="r-no" data-i="noPrint" onclick="setReceipt(false)"></button>
    </div>
    <div class="bar" style="margin-top:20px">
      <div class="sum"><span data-i="payAmt"></span><b id="fin1"></b></div>
      <button class="cta" data-i="nextPay" onclick="show('s-pay')"></button>
    </div>
  </div>

  <div id="s-pay" class="screen">
    <button class="back" data-i="back" onclick="show('s-benefit')"></button>
    <h2 class="t" data-i="payT"></h2>
    <div class="card rows" id="pay-sum"></div>
    <button class="tile" id="m-card" onclick="pickMethod('card')"><span class="ic">💳</span><span class="tx"><b data-i="card"></b><small data-i="cardS"></small></span></button>
    <button class="tile" id="m-easy" onclick="pickMethod('easy')"><span class="ic">📲</span><span class="tx"><b data-i="easyPay"></b><small data-i="easyPayS"></small></span></button>
    <div class="chips" id="easy-chips" style="display:none"></div>
    <div class="bar" style="margin-top:auto">
      <div class="sum"><span data-i="finalAmt"></span><b id="fin2"></b></div>
      <button class="cta ok" id="pay-btn" disabled onclick="startPay()"></button>
    </div>
  </div>

  <div id="s-done" class="screen">
    <div class="center">
      <div style="font-size:56px">🎉</div>
      <h2 class="t" style="margin:6px 0 2px" data-i="doneT"></h2>
      <p style="font-size:17px;color:var(--sub);font-weight:600" id="d-place"></p>
      <div class="ticket">
        <div class="rh"><div style="font-size:17px;font-weight:800" data-i="rcpt"></div><div style="font-size:16px;color:var(--sub);font-weight:600"><span data-i="queue"></span> <b style="color:var(--pri);font-size:26px" id="d-q"></b></div></div>
        <div class="rows" id="d-rows"></div>
        <div style="font-size:16px;font-weight:700;color:var(--ok);text-align:center;margin-top:10px;line-height:1.5" id="d-note"></div>
      </div>
      <button class="cta" data-i="home" onclick="resetAll()"></button>
    </div>
  </div>
</div>

<div class="ov" id="o-lang"><div class="sheet"><div class="mh"><h3 data-i="langT"></h3><button class="close" data-i="close" onclick="closeAll()"></button></div><div class="two" id="lang-grid"></div></div></div>
<div class="ov" id="o-cat"><div class="sheet"><div class="mh"><h3 data-i="catT"></h3><button class="close" data-i="close" onclick="closeAll()"></button></div><div class="two" id="cat-grid"></div></div></div>
<div class="ov" id="o-temp"><div class="sheet"><div class="mh"><h3 data-i="tempT"></h3><button class="close" data-i="close" onclick="closeAll()"></button></div>
  <div class="two"><button class="temp cold" onclick="showTemp(1)"><span>❄️</span><i data-i="cold" style="font-style:normal"></i></button><button class="temp hot" onclick="showTemp(2)"><span>🔥</span><i data-i="hot" style="font-style:normal"></i></button></div></div></div>
<div class="ov" id="o-menu"><div class="sheet"><div class="mh"><h3 data-i="menuT"></h3><button class="close" data-i="close" onclick="closeAll()"></button></div><div class="two" id="menu-list"></div></div></div>
<div class="ov" id="o-key"><div class="sheet"><div class="mh"><h3 id="key-t"></h3><button class="close" data-i="close" onclick="closeAll()"></button></div>
  <div class="phone" id="phone">010 - </div><div class="hint" id="hint"></div><div class="keys" id="keys"></div>
  <button class="cta" data-i="ok" onclick="confirmKeypad()"></button></div></div>
<div class="ov" id="o-paying" style="align-items:center"><div class="sheet" style="border-radius:30px;max-width:420px;margin:0 16px;text-align:center"><div class="spin"></div><h3 style="font-size:23px;margin-bottom:8px" id="pay-t"></h3><p style="font-size:18px;color:var(--sub);font-weight:600;line-height:1.5" id="pay-d"></p></div></div>
<div class="ov" id="o-idle" style="align-items:center"><div class="sheet" style="border-radius:30px;max-width:420px;margin:0 16px;text-align:center"><div style="font-size:44px">⏰</div><h3 style="font-size:23px;margin:8px 0" data-i="idleT"></h3><p style="font-size:18px;color:var(--sub);margin-bottom:16px" id="idle-d"></p><button class="cta" data-i="idleBtn" onclick="idleKeep()"></button></div></div>

<script>
/* [이모지, ko, en, ja, zh, 가격, 설명ko, 설명en] */
const M=[
['🧊☕','아이스 아메리카노','Iced Americano','アイスアメリカーノ','冰美式',2000,'기본 2샷 시원한 커피','Classic 2-shot iced coffee'],
['🧊💪','메가리카노 (대용량)','Mega Americano (Large)','メガアメリカーノ(大)','大杯美式',3300,'32oz 큰 아메리카노','Extra-large 32oz'],
['🤎','할메가커피','Halmega Coffee','ハルメガコーヒー','哈梅加咖啡',2100,'달달한 옛날 믹스커피 맛','Sweet classic mix-coffee taste'],
['🌾','할메가미숫커피','Halmega Misugaru Coffee','ハルメガ ミスカル珈琲','哈梅加炒米咖啡',2900,'미숫가루 + 커피','Grain powder + coffee'],
['☕','따뜻한 아메리카노','Hot Americano','ホットアメリカーノ','热美式',1700,'기본 2샷 따뜻한 커피','Classic 2-shot hot coffee'],
['🥛','따뜻한 카페라떼','Hot Café Latte','ホットカフェラテ','热拿铁',2900,'부드러운 우유 커피','Smooth milk coffee'],

const COUPON=1000,MEMBER_RATE=.05,POINT_RATE=.03,MAX=9;

const t=(k,n)=>{const s=(T[k]||[])[LI]||k;return n===undefined?s:s.replace('{n}',n)};
const nm=id=>M[id][1+LI],ds=id=>LI===0?M[id][6]:LI===1?M[id][7]:'';

const memberOff=()=>member?Math.floor(sub()*MEMBER_RATE/10)*10:0,couponOff=()=>coupon?COUPON:0;
const fin=()=>Math.max(0,sub()-couponOff()-memberOff());
const earnTo=()=>point||member,earn=()=>earnTo()?Math.floor(fin()*POINT_RATE):0;
const fmt=d=>'010-'+d.slice(0,4)+'-'+d.slice(4);

}

  $('o-lang').classList.add('active');
}

}

  cur=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));

  window.scrollTo(0,0);render();
}

const stepper=(minus,plus,q)=>`<div class="qty"><button aria-label="−" onclick="${minus}">−</button><b>${q}</b><button aria-label="+" onclick="${plus}">+</button></div>`;
function renderTray(){
  const s=$('tray-items');s.innerHTML='';
  cart.forEach((c,i)=>{
    const d=document.createElement('div');d.className='tcard';
    d.innerHTML=`<button class="x" aria-label="${esc(nm(c.id))} ✕" onclick="del(${i})">✕</button><div class="em">${M[c.id][0]}</div><div class="nm">${esc(nm(c.id))}</div><div class="pr">${won(M[c.id][5]*c.q)}</div>${stepper(`chg(${i},-1)`,`chg(${i},1)`,c.q)}`;
    s.appendChild(d);
  });
  const a=document.createElement('button');a.className='slot';a.onclick=openCat;
  a.innerHTML=`<div class="plus">+</div><b>${t(cart.length?'addMore':'addMenu')}</b><small>${t('slotSub')}</small>`;
  s.appendChild(a);
  $('cnt').textContent=t('cnt',cnt());$('sub').textContent=won(sub());
  const b=$('next');b.disabled=!cart.length;b.textContent=cart.length?t('next'):t('needFirst');
}
function chg(i,d){cart[i].q=Math.min(MAX,Math.max(1,cart[i].q+d));renderTray()}
function del(i){cart.splice(i,1);renderTray()}
function put(id,q){const f=cart.find(c=>c.id===id);if(f)f.q=Math.min(MAX,f.q+q);else cart.push({id,q});}
function addItem(id,q){put(id,q);closeAll();render()}

function renderNormal(){
  $('tabs').innerHTML=CATS.map((c,i)=>`<button class="tab${i===ncat?' sel':''}" onclick="ncat=${i};renderNormal()">${c[0]} ${t('c'+i)}</button>`).join('');
  $('nlist').innerHTML=CATS[ncat][1].concat(CATS[ncat][2]||[]).map(id=>{
    const c=cart.find(x=>x.id===id);
    return `<div class="nrow"><div class="em">${M[id][0]}</div><div><div class="nm">${esc(nm(id))}</div><div class="un">${esc(ds(id))}</div><div class="pr">${won(M[id][5])}</div></div>${c?stepper(`nchg(${id},-1)`,`nchg(${id},1)`,c.q):`<button class="addb" onclick="addItem(${id},1)">${t('add')}</button>`}</div>`;
  }).join('');
  $('ncnt').textContent=t('cnt',cnt());$('nsub').textContent=won(sub());
  const b=$('nnext');b.disabled=!cart.length;b.textContent=cart.length?t('next'):t('needFirst');
}
function nchg(id,d){const c=cart.find(x=>x.id===id);c.q=Math.min(MAX,c.q+d);if(c.q<1)cart.splice(cart.indexOf(c),1);renderNormal()}

function openCat(){
  $('cat-grid').innerHTML=CATS.map((c,i)=>`<button class="cat" onclick="pickCat(${i})"><div class="e">${c[0]}</div><b>${t('c'+i)}</b></button>`).join('');
  $('o-cat').classList.add('active');
}
function pickCat(k){cat=k;closeAll();CATS[k][2]?$('o-temp').classList.add('active'):renderMenus(CATS[k][1])}
function showTemp(n){closeAll();renderMenus(CATS[cat][n])}
function renderMenus(ids){
  const g=$('menu-list');g.innerHTML='';
  ids.forEach(id=>{
    let q=1;const d=document.createElement('div');d.className='menu';
    d.innerHTML=`<div class="e">${M[id][0]}</div><b class="nm">${esc(nm(id))}</b><div class="un">${esc(ds(id))}</div><em>${won(M[id][5])}</em>${stepper('','',1)}<button class="add"></button>`;
    const [m,p]=d.querySelectorAll('.qty button'),n=d.querySelector('.qty b'),a=d.querySelector('.add');
    const up=()=>{n.textContent=q;a.textContent=t('addN',q)};up();
    m.onclick=()=>{q=Math.max(1,q-1);up()};p.onclick=()=>{q=Math.min(MAX,q+1);up()};a.onclick=()=>addItem(id,q);
    g.appendChild(d);
  });
  $('o-menu').classList.add('active');
}
const OVS=['o-lang','o-cat','o-temp','o-menu','o-key'];
function closeAll(){OVS.forEach(i=>$(i).classList.remove('active'))}
OVS.forEach(i=>$(i).addEventListener('click',e=>{if(e.target.id===i)closeAll()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

function toggleCoupon(){coupon=!coupon;renderBenefit()}
function setReceipt(v){receipt=v;$('r-yes').classList.toggle('sel',v);$('r-no').classList.toggle('sel',!v)}
function renderBenefit(){
  $('t-coupon').classList.toggle('on',coupon);$('st-coupon').textContent=t(coupon?'applied':'apply');
  $('t-member').classList.toggle('on',!!member);$('st-member').textContent=t(member?'change':'input');
  $('sm-member').textContent=member?`${fmt(member)} · -${won(memberOff())}`:t('memberS');
  $('t-point').classList.toggle('on',!!point);$('st-point').textContent=t(point?'change':'input');
  $('sm-point').textContent=point?`${fmt(point)} · ${t('pointOn',won(earn()))}`:t('pointS');
  $('fin1').textContent=won(fin());
}
['1','2','3','4','5','6','7','8','9','clear','0','←'].forEach(k=>{
  const b=document.createElement('button');if(k==='clear')b.dataset.i='clear';else b.textContent=k;
  b.onclick=()=>{if(k==='clear')kd='';else if(k==='←')kd=kd.slice(0,-1);else if(kd.length<8)kd+=k;drawKey()};
  $('keys').appendChild(b);
});
function drawKey(){$('phone').textContent='010 - '+(kd.length<=4?kd:kd.slice(0,4)+' - '+kd.slice(4));$('hint').textContent=kd.length&&kd.length<8?t('more',8-kd.length):''}
function openKeypad(m){kp=m;kd=(m==='member'?member:point)||'';$('key-t').textContent=t(m==='member'?'keyMember':'keyPoint');
  document.querySelectorAll('#keys [data-i]').forEach(e=>e.textContent=t(e.dataset.i));drawKey();$('o-key').classList.add('active')}
function confirmKeypad(){
  if(kd.length!==8&&kd.length!==0){$('hint').textContent=t('need8');return}
  if(kp==='member')member=kd;else point=kd;closeAll();renderBenefit();
}

function renderPay(){
  const r=[[t('orderAmt'),won(sub())]];
  if(coupon)r.push([t('coupon'),'-'+won(COUPON)]);
  if(member)r.push([t('mDisc'),'-'+won(memberOff())]);
  $('pay-sum').innerHTML=r.map(x=>`<div class="r"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')+`<div class="r big"><span>${t('total')}</span><span>${won(fin())}</span></div>`;
  $('fin2').textContent=won(fin());
  ['card','easy'].forEach(k=>$('m-'+k).classList.toggle('on',method===k));
  const c=$('easy-chips');c.style.display=method==='easy'?'grid':'none';
  c.innerHTML=EASY.map(n=>`<button class="chip${easy===n?' sel':''}" onclick="pickEasy('${n}')">${n}</button>`).join('');
  const ready=method==='card'||(method==='easy'&&easy),b=$('pay-btn');b.disabled=!ready;
  b.textContent=!method?t('pickM'):ready?t('payBtn',won(fin())):t('pickE');
}
function pickMethod(m){method=m;if(m==='card')easy='';renderPay()}
function pickEasy(n){easy=n;renderPay()}
function startPay(){
  const c=method==='card';
  $('pay-t').textContent=c?t('insC'):t('payingE',easy);$('pay-d').textContent=c?t('insCD'):t('approve');
  idleAt=Date.now();$('o-paying').classList.add('active');
  setTimeout(()=>{$('o-paying').classList.remove('active');show('s-done')},2500);
}
function buildDone(){
  $('d-place').textContent=t(place);$('d-q').textContent=queue;
  const rows=cart.map(c=>`<div class="r"><span>${esc(nm(c.id))} × ${c.q}</span><span>${won(M[c.id][5]*c.q)}</span></div>`);
  if(coupon)rows.push(`<div class="r"><span>${t('coupon')}</span><span>-${won(COUPON)}</span></div>`);
  if(member)rows.push(`<div class="r"><span>${t('mDisc')}</span><span>-${won(memberOff())}</span></div>`);
  rows.push(`<div class="r"><span>${t('payM')}</span><span>${method==='card'?t('cardShort'):esc(easy)}</span></div>`,`<div class="r big"><span>${t('total')}</span><span>${won(fin())}</span></div>`);
  $('d-rows').innerHTML=rows.join('');
  let n=t(receipt?'rcptOn':'rcptOff');
  if(earnTo())n+=`<br>${fmt(earnTo())} · ${t('earned',won(earn()))}`;
  $('d-note').innerHTML=n;
}
function resetAll(){
  cart=[];coupon=false;member='';point='';method='';easy='';kd='';queue++;
  setReceipt(true);closeAll();$('o-idle').classList.remove('active');show('s-mode');
}

let idleAt=Date.now(),left=0;
const idleOn=()=>$('o-idle').classList.contains('active');
function idleKeep(){idleAt=Date.now();$('o-idle').classList.remove('active')}
['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>{if(!idleOn())idleAt=Date.now()}));
setInterval(()=>{
  if(cur==='s-mode'||$('o-paying').classList.contains('active')){idleAt=Date.now();return}
  if(!idleOn()&&Date.now()-idleAt>60000){left=15;$('idle-d').textContent=t('idleD',left);$('o-idle').classList.add('active')}
  else if(idleOn()){left--;$('idle-d').textContent=t('idleD',Math.max(left,0));if(left<=0)resetAll()}
},1000);
applyLang();
</script>
</body>
</html>
